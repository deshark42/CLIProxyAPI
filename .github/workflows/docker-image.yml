name: docker-image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      version: ${{ steps.build.outputs.version }}
      commit: ${{ steps.build.outputs.commit }}
      date: ${{ steps.build.outputs.date }}
      architectures: ${{ steps.build.outputs.architectures }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
    steps:
      - name: Generate build metadata
        id: build
        env:
          ENABLE_ARM64_BUILDS: ${{ vars.ENABLE_ARM64_BUILDS }}
        shell: bash
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [[ "$ENABLE_ARM64_BUILDS" == "true" ]]; then
              echo 'architectures=["amd64","arm64"]'
            else
              echo 'architectures=["amd64"]'
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.build.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          flavor: latest=false

  build:
    name: build (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.metadata.outputs.architectures) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_DATE=${{ needs.metadata.outputs.date }}
          labels: ${{ needs.metadata.outputs.labels }}
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          overwrite: true

  publish:
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifests
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          METADATA_JSON: ${{ needs.metadata.outputs.json }}
          ARCHITECTURES: ${{ needs.metadata.outputs.architectures }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          [[ ${#tag_args[@]} -gt 0 ]]

          shopt -s nullglob
          digest_files=("$DIGEST_DIR"/*)
          expected_count="$(jq -r 'length' <<< "$ARCHITECTURES")"
          if [[ ${#digest_files[@]} -ne "$expected_count" ]]; then
            echo "Expected image digests for $expected_count enabled architecture(s)" >&2
            exit 1
          fi
          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="${digest_file##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          tag="$(jq -r '.tags[0]' <<< "$METADATA_JSON")"
          docker buildx imagetools inspect "$tag"
          docker buildx imagetools inspect --raw "$tag" | jq -e --argjson expected "$ARCHITECTURES" '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | unique | sort == ($expected | sort)
          '
