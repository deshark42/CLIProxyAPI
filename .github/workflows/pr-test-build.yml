name: pr-test-build

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test configuration and OpenAI API handlers
        run: go test ./internal/config ./sdk/api/handlers/openai ./internal/watcher/diff -timeout 90s
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
